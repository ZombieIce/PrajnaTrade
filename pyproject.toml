[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "prajnatrade"
version = "0.1.0"
description = "Local-first autonomous quantitative research for a five-ETF portfolio"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=20",
]

[project.optional-dependencies]
test = ["pytest>=8.0", "ruff>=0.9"]

[project.scripts]
prajnatrade = "prajnatrade.cli:main"
prajnatrade-agent = "prajnatrade.cli:agent_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "isolation: requires the real macOS sandbox_init boundary; excluded in nested/sandboxed sessions",
    "docker: requires a local Docker/Colima daemon and the issue 27 runner image; skipped when unavailable",
]
